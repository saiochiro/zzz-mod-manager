<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ai-graphite-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f5ff0"/>
      <stop offset="1" stop-color="#2d74c9"/>
    </linearGradient>
    <radialGradient id="ai-graphite-hi" cx="0.25" cy="0.08" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ai-graphite-orb" cx="0.36" cy="0.3" r="0.82">
