      <stop offset="0.55" stop-color="#1d1f23"/>
      <stop offset="1" stop-color="#0f1115"/>
    </radialGradient>
    <radialGradient id="ai-graphite-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
