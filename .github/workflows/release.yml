# Ships an app update automatically.
#
# Whenever main gets a new "version" in package.json (and there is no release
# for it yet), this builds the Windows installer on GitHub's Windows runner and
# publishes release vX.Y.Z with the Setup .exe, its .blockmap and latest.yml.
# Installed copies of the app read latest.yml and show the "update available"
# prompt, with RELEASE_NOTES.md as the "What's new" text. It also attaches
# ProxyLaunch-X.Y.Z.zip (installer + README) for uploading to GameBanana.
#
# To ship an update: bump "version" in package.json, update RELEASE_NOTES.md,
# and push to main. That's it.

name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', 'RELEASE_NOTES.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"
          ASSETS=$(gh release view "v$V" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qx latest.yml; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            if echo "$ASSETS" | grep -qx "ProxyLaunch-$V.zip"; then
              echo "Release v$V already published; nothing to do."
            else
              echo "Release v$V is published but has no GameBanana zip; adding it."
              echo "ZIP_ONLY=1" >> "$GITHUB_ENV"
            fi
          fi

      - name: Add GameBanana zip to an existing release
        if: env.ZIP_ONLY == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release gb
          gh release download "$TAG" --pattern "ProxyLaunch-Setup-$VERSION.exe" --dir release
          cp "release/ProxyLaunch-Setup-$VERSION.exe" gb/
          cp docs/GameBanana-README.txt gb/README.txt
          7z a -tzip "release/ProxyLaunch-$VERSION.zip" ./gb/*
          gh release upload "$TAG" "release/ProxyLaunch-$VERSION.zip" --clobber

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: env.SKIP != '1'
        shell: bash
        run: npm ci || npm install

      - name: Build app
        if: env.SKIP != '1'
        shell: bash
        run: |
          # Type errors are reported but don't block the build (tsc still emits JS).
          node ./node_modules/typescript/bin/tsc -p tsconfig.electron.json || echo "::warning::TypeScript reported errors; JavaScript was still emitted."
          node ./node_modules/vite/bin/vite.js build

      - name: Package installer
        if: env.SKIP != '1'
        run: npx electron-builder --win nsis portable --publish never

      - name: Publish release
        if: env.SKIP != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SETUP="release/ProxyLaunch-Setup-$VERSION.exe"
          FILES=("$SETUP" "$SETUP.blockmap" "release/latest.yml" "release/ProxyLaunch-Portable-$VERSION.exe")
          for f in "${FILES[@]}"; do [ -f "$f" ] || { echo "::error::Missing $f"; ls -la release; exit 1; }; done

          # Zip for GameBanana (it only accepts archives): installer + README.
          mkdir -p gb && cp "$SETUP" gb/ && cp docs/GameBanana-README.txt gb/README.txt
          7z a -tzip "release/ProxyLaunch-$VERSION.zip" ./gb/*
          FILES+=("release/ProxyLaunch-$VERSION.zip")

          NOTES=RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "Bug fixes and improvements." > /tmp/notes.md; NOTES=/tmp/notes.md; }

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "ProxyLaunch $VERSION" \
              --notes-file "$NOTES"
          fi
