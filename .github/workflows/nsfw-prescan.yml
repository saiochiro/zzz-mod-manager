# Content pre-scan: labels GameBanana mods ahead of time so the app never scans on users' PCs.
# Publishes verdicts.json on the nsfw-verdicts branch (one commit, replaced each run so history
# doesn't grow). The app downloads it from raw.githubusercontent.com.
name: Content pre-scan
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
concurrency:
  group: nsfw-prescan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  prescan:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pre" && cd "$RUNNER_TEMP/pre"
          npm init -y >/dev/null
          npm i --no-audit --no-fund @tensorflow/tfjs-node@4.22.0 sharp@0.33.5 esbuild@0.21.5
          cp "$GITHUB_WORKSPACE/scripts/nsfw-prescan.mjs" .
          npx esbuild "$GITHUB_WORKSPACE/src/shared/nsfw.ts" --format=esm --platform=node --outfile=nsfw.mjs
      - name: Current list
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if git fetch --depth 1 origin nsfw-verdicts; then git show FETCH_HEAD:verdicts.json > "$RUNNER_TEMP/out/verdicts.json" || true; fi
          ls -la "$RUNNER_TEMP/out"
      - name: Scan
        shell: bash
        env:
          BUDGET_MIN: '45'
        run: |
          set -o pipefail
          node "$RUNNER_TEMP/pre/nsfw-prescan.mjs" "$RUNNER_TEMP/pre/nsfw.mjs" prescan/models "$RUNNER_TEMP/out/verdicts.json" 2>&1 | tee run.log \
            || { tail -12 run.log | while IFS= read -r l; do echo "::error::${l:0:800}"; done; exit 1; }
          grep -E "^(mods on|to scan|done|labels in)" run.log | while IFS= read -r l; do echo "::notice::$l"; done
      - name: Publish
        if: always()
        shell: bash
        run: |
          [ -s "$RUNNER_TEMP/out/verdicts.json" ] || exit 0
          cd "$RUNNER_TEMP/out"
          git init -q -b nsfw-verdicts
          git config user.name "prescan-bot"
          git config user.email "prescan-bot@users.noreply.github.com"
          git add verdicts.json
          git commit -q -m "Content labels [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:nsfw-verdicts
